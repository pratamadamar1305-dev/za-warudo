name: Android APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Build web game
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace --info assembleDebug -PVERSION_CODE=${GITHUB_RUN_NUMBER} -PVERSION_NAME=1.0.${GITHUB_RUN_NUMBER} > gradle-build.log 2>&1
          RESULT=$?
          cat gradle-build.log
          if [ "$RESULT" -ne 0 ]; then
            DETAILS=$(python3 - <<'PY'
          from pathlib import Path
          lines = Path('gradle-build.log').read_text(errors='replace').splitlines()
          anchors = ('What went wrong:', 'Could not resolve', 'Could not find', 'Execution failed', 'FAILURE: Build failed', 'error:')
          starts = [i for i, line in enumerate(lines) if any(term in line for term in anchors)]
          selected = []
          for start in starts[-4:]:
              selected.extend(lines[start:min(start + 16, len(lines))])
          if not selected:
              selected = lines[-50:]
          print('\\n'.join(selected)[-5000:])
          PY
            )
            echo "::error title=Gradle build diagnostics::$DETAILS"
          fi
          exit "$RESULT"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurobeat-drift-legend-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: EUROBEAT DRIFT LEGEND Android APK (debug)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
