name: Android APK

on:
  push:
    branches: [arena/4a46aaf0-za-warudo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Build web game
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PVERSION_CODE=${GITHUB_RUN_NUMBER} -PVERSION_NAME=1.0.${GITHUB_RUN_NUMBER}
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurobeat-drift-legend-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: EUROBEAT DRIFT LEGEND Android APK (debug)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
